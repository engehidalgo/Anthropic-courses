<!DOCTYPE html>
<html lang='es'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1.0'>
<title>Claude 101 — Capítulo 3: Expandiendo el alcance de Claude</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --black: #0a0a0a;
    --near-black: #111111;
    --dark: #1a1a1a;
    --mid: #2a2a2a;
    --border: #333;
    --text: #e8e6e1;
    --muted: #888;
    --orange: #d4783a;
    --orange-light: #e8934f;
    --orange-glow: rgba(212,120,58,0.15);
    --blue: #3a7bd4;
    --blue-light: #5a9be8;
    --green: #2d7a4f;
    --green-light: #3da066;
    --green-bg: rgba(45,122,79,0.12);
    --red: #8b2424;
    --red-light: #c43030;
    --red-bg: rgba(139,36,36,0.12);
    --radius: 12px;
    --radius-sm: 8px;
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--black);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.6;
  }

  .header {
    background: linear-gradient(135deg, #0a0a0a 0%, #081018 40%, #0f0f0f 70%, #0a0a0a 100%);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(12px);
  }

  .header-inner {
    max-width: 860px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 18px 0 14px;
    flex-wrap: wrap;
  }

  .logo { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }

  .asterisk { width: 32px; height: 32px; color: var(--orange); flex-shrink: 0; }

  .logo-text {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 1.1rem;
    color: var(--text);
    letter-spacing: -0.02em;
  }

  .logo-text span { color: var(--orange); }

  .header-meta { margin-left: auto; display: flex; align-items: center; gap: 12px; flex-shrink: 0; }

  .chapter-badge {
    font-family: 'Syne', sans-serif;
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--orange);
    background: var(--orange-glow);
    border: 1px solid rgba(212,120,58,0.3);
    padding: 4px 10px;
    border-radius: 20px;
  }

  .score-pill {
    font-family: 'Syne', sans-serif;
    font-size: 0.8rem;
    font-weight: 700;
    color: var(--muted);
    background: var(--mid);
    border: 1px solid var(--border);
    padding: 4px 12px;
    border-radius: 20px;
    transition: all 0.3s;
  }

  .score-pill.active {
    color: var(--blue-light);
    border-color: rgba(58,123,212,0.4);
    background: rgba(58,123,212,0.1);
  }

  .progress-container {
    background: var(--near-black);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    position: sticky;
    top: 71px;
    z-index: 99;
  }

  .progress-inner {
    max-width: 860px;
    margin: 0 auto;
    padding: 10px 0;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .progress-bar-wrap { flex: 1; height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }

  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--blue), var(--blue-light));
    border-radius: 2px;
    transition: width 0.5s cubic-bezier(0.4,0,0.2,1);
    width: 0%;
    box-shadow: 0 0 8px rgba(90,155,232,0.5);
  }

  .progress-text {
    font-size: 0.72rem;
    color: var(--muted);
    white-space: nowrap;
    font-family: 'Syne', sans-serif;
    font-weight: 600;
    letter-spacing: 0.05em;
  }

  .main { max-width: 860px; margin: 0 auto; padding: 40px 24px 80px; }

  .hero {
    text-align: center;
    padding: 48px 0 56px;
    position: relative;
  }

  .hero::before {
    content: '';
    position: absolute;
    top: 0; left: 50%; transform: translateX(-50%);
    width: 300px; height: 300px;
    background: radial-gradient(ellipse, rgba(58,123,212,0.07) 0%, transparent 70%);
    pointer-events: none;
  }

  .hero-eyebrow {
    font-family: 'Syne', sans-serif;
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--orange);
    margin-bottom: 16px;
  }

  .hero-title {
    font-family: 'Syne', sans-serif;
    font-size: clamp(1.8rem, 5vw, 2.8rem);
    font-weight: 800;
    line-height: 1.05;
    letter-spacing: -0.04em;
    color: var(--text);
    margin-bottom: 16px;
  }

  .hero-subtitle {
    font-size: 1rem;
    color: var(--muted);
    max-width: 520px;
    margin: 0 auto 32px;
    font-weight: 300;
  }

  .hero-stats { display: flex; justify-content: center; gap: 32px; flex-wrap: wrap; }

  .hero-stat { text-align: center; }

  .hero-stat-num {
    font-family: 'Syne', sans-serif;
    font-size: 1.5rem;
    font-weight: 800;
    color: var(--orange);
  }

  .hero-stat-label { font-size: 0.72rem; color: var(--muted); letter-spacing: 0.05em; text-transform: uppercase; }

  .section-header {
    display: flex;
    align-items: center;
    gap: 14px;
    margin: 48px 0 24px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }

  .section-number {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: var(--orange-glow);
    border: 1px solid rgba(212,120,58,0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Syne', sans-serif;
    font-size: 0.8rem;
    font-weight: 800;
    color: var(--orange);
    flex-shrink: 0;
  }

  .section-info h2 {
    font-family: 'Syne', sans-serif;
    font-size: 1.05rem;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -0.02em;
  }

  .section-info p { font-size: 0.78rem; color: var(--muted); margin-top: 2px; }

  .question-card {
    background: var(--near-black);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px;
    margin-bottom: 16px;
    transition: border-color 0.2s;
  }

  .question-card.answered-correct {
    border-color: var(--green);
    background: linear-gradient(135deg, var(--near-black), rgba(45,122,79,0.05));
  }

  .question-card.answered-wrong {
    border-color: var(--red);
    background: linear-gradient(135deg, var(--near-black), rgba(139,36,36,0.05));
  }

  .question-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }

  .question-num {
    font-family: 'Syne', sans-serif;
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .question-dot { width: 3px; height: 3px; border-radius: 50%; background: var(--border); }

  .question-section-tag {
    font-size: 0.65rem;
    color: var(--orange);
    background: var(--orange-glow);
    border: 1px solid rgba(212,120,58,0.2);
    padding: 2px 7px;
    border-radius: 10px;
    font-weight: 500;
  }

  .question-text { font-size: 0.97rem; color: var(--text); margin-bottom: 20px; line-height: 1.55; font-weight: 400; }

  .options-grid { display: grid; gap: 8px; }

  .option-btn {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 14px 16px;
    background: var(--dark);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    cursor: pointer;
    text-align: left;
    transition: all 0.15s;
    font-family: 'DM Sans', sans-serif;
    width: 100%;
  }

  .option-btn:hover:not(:disabled) {
    border-color: rgba(212,120,58,0.4);
    background: rgba(212,120,58,0.05);
  }

  .option-btn:disabled { cursor: default; }

  .option-badge {
    width: 26px;
    height: 26px;
    border-radius: 6px;
    background: var(--mid);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Syne', sans-serif;
    font-size: 0.72rem;
    font-weight: 800;
    color: var(--muted);
    flex-shrink: 0;
    transition: all 0.15s;
  }

  .option-text { font-size: 0.9rem; color: var(--text); line-height: 1.45; padding-top: 2px; font-weight: 300; }

  .option-btn.correct { border-color: var(--green-light); background: var(--green-bg); }
  .option-btn.correct .option-badge { background: var(--green); border-color: var(--green-light); color: #fff; }

  .option-btn.wrong { border-color: var(--red-light); background: var(--red-bg); }
  .option-btn.wrong .option-badge { background: var(--red); border-color: var(--red-light); color: #fff; }

  .option-btn.show-correct { border-color: var(--green); background: rgba(45,122,79,0.06); opacity: 0.7; }
  .option-btn.show-correct .option-badge { background: var(--green); border-color: var(--green-light); color: #fff; }

  .feedback-box {
    margin-top: 14px;
    padding: 14px 16px;
    border-radius: var(--radius-sm);
    font-size: 0.85rem;
    line-height: 1.5;
    font-weight: 300;
    display: none;
    animation: fadeSlide 0.25s ease;
  }

  @keyframes fadeSlide {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .feedback-box.correct-fb { display: block; background: var(--green-bg); border: 1px solid var(--green); color: #7dd4a0; }
  .feedback-box.wrong-fb { display: block; background: var(--red-bg); border: 1px solid var(--red-light); color: #e08080; }

  .feedback-label {
    font-family: 'Syne', sans-serif;
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 4px;
  }

  .feedback-box.correct-fb .feedback-label { color: var(--green-light); }
  .feedback-box.wrong-fb .feedback-label { color: var(--red-light); }

  .results-panel {
    display: none;
    background: var(--near-black);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 40px;
    margin-top: 48px;
    text-align: center;
    animation: fadeSlide 0.4s ease;
  }

  .results-panel.visible { display: block; }

  .results-icon { font-size: 3rem; margin-bottom: 16px; }

  .results-title {
    font-family: 'Syne', sans-serif;
    font-size: 1.8rem;
    font-weight: 800;
    letter-spacing: -0.03em;
    margin-bottom: 8px;
  }

  .results-score {
    font-family: 'Syne', sans-serif;
    font-size: 4rem;
    font-weight: 800;
    line-height: 1;
    margin: 16px 0;
    color: var(--orange);
  }

  .results-sub { font-size: 0.9rem; color: var(--muted); margin-bottom: 32px; }

  .section-breakdown { display: grid; gap: 12px; margin: 24px 0; text-align: left; }

  .breakdown-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    background: var(--dark);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
  }

  .breakdown-label { flex: 1; font-size: 0.85rem; color: var(--text); font-weight: 400; }

  .breakdown-stat { font-family: 'Syne', sans-serif; font-size: 0.85rem; font-weight: 700; color: var(--muted); }

  .breakdown-bar-wrap { width: 80px; height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }

  .breakdown-bar-fill { height: 100%; border-radius: 2px; background: linear-gradient(90deg, var(--blue), var(--blue-light)); }
  .breakdown-bar-fill.good { background: linear-gradient(90deg, var(--green), var(--green-light)); }
  .breakdown-bar-fill.bad { background: linear-gradient(90deg, var(--red), var(--red-light)); }

  .retry-btn {
    margin-top: 24px;
    padding: 14px 32px;
    background: var(--orange);
    color: var(--black);
    border: none;
    border-radius: var(--radius-sm);
    font-family: 'Syne', sans-serif;
    font-size: 0.9rem;
    font-weight: 800;
    letter-spacing: 0.05em;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
  }

  .retry-btn:hover { background: var(--orange-light); transform: translateY(-1px); }
  .retry-btn:active { transform: translateY(0); }

  .quiz-divider {
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--border), transparent);
    margin: 48px 0;
  }

  .sticky-nav {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--dark);
    border: 1px solid var(--border);
    border-radius: 100px;
    padding: 8px 8px 8px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    backdrop-filter: blur(12px);
    z-index: 200;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s, transform 0.3s;
  }

  .sticky-nav.visible { opacity: 1; pointer-events: all; }

  .sticky-nav-text { font-size: 0.82rem; color: var(--muted); white-space: nowrap; }

  .sticky-nav-text strong { color: var(--text); font-family: 'Syne', sans-serif; font-weight: 700; }

  .see-results-btn {
    padding: 10px 20px;
    background: var(--orange);
    color: var(--black);
    border: none;
    border-radius: 100px;
    font-family: 'Syne', sans-serif;
    font-size: 0.8rem;
    font-weight: 800;
    cursor: pointer;
    transition: background 0.2s;
    letter-spacing: 0.03em;
  }

  .see-results-btn:hover { background: var(--orange-light); }

  @media (max-width: 600px) {
    .main { padding: 24px 16px 100px; }
    .question-card { padding: 20px; }
    .header-inner { gap: 8px; }
    .hero-stats { gap: 20px; }
  }
</style>
</head>
<body>

<header class='header'>
  <div class='header-inner'>
    <div class='logo'>
      <svg class='asterisk' viewBox='0 0 100 100' fill='none' xmlns='http://www.w3.org/2000/svg'>
        <line x1='50' y1='5' x2='50' y2='95' stroke='currentColor' stroke-width='10' stroke-linecap='round'/>
        <line x1='5' y1='27.5' x2='95' y2='72.5' stroke='currentColor' stroke-width='10' stroke-linecap='round'/>
        <line x1='5' y1='72.5' x2='95' y2='27.5' stroke='currentColor' stroke-width='10' stroke-linecap='round'/>
      </svg>
      <span class='logo-text'>Claude <span>101</span></span>
    </div>
    <div class='header-meta'>
      <span class='chapter-badge'>Cap. 3</span>
      <span class='score-pill' id='scoreDisplay'>0 / 0</span>
    </div>
  </div>
</header>

<div class='progress-container'>
  <div class='progress-inner'>
    <div class='progress-bar-wrap'>
      <div class='progress-bar-fill' id='progressBar'></div>
    </div>
    <span class='progress-text' id='progressText'>0 / 50</span>
  </div>
</div>

<main class='main'>
  <div class='hero'>
    <div class='hero-eyebrow'>Anthropic Academy · Claude 101</div>
    <h1 class='hero-title'>Expandiendo el alcance de Claude</h1>
    <p class='hero-subtitle'>Pon a prueba lo que aprendiste sobre Connectors, Enterprise Search y Research mode — y cómo amplían las capacidades de Claude.</p>
    <div class='hero-stats'>
      <div class='hero-stat'><div class='hero-stat-num'>50</div><div class='hero-stat-label'>Preguntas</div></div>
      <div class='hero-stat'><div class='hero-stat-num'>3</div><div class='hero-stat-label'>Secciones</div></div>
      <div class='hero-stat'><div class='hero-stat-num'>~20</div><div class='hero-stat-label'>Minutos</div></div>
    </div>
  </div>

  <div id='quizContainer'></div>
  <div class='results-panel' id='resultsPanel'></div>
</main>

<div class='sticky-nav' id='stickyNav'>
  <span class='sticky-nav-text'>Respondidas: <strong id='navAnswered'>0</strong> de <strong>50</strong></span>
  <button class='see-results-btn' onclick='showResults()'>Ver resultados →</button>
</div>

<script>
'use strict';

var questions = [

  // ==================== SECCIÓN 1: Connectors — Conexión con herramientas ====================
  {
    section: 'Connectors — Conexión con herramientas',
    sectionIdx: 1,
    text: '¿Cuál es la mejor descripción del rol de los connectors en Claude?',
    options: [
      'Son extensiones de pago que aumentan el límite de tokens de Claude',
      'Transforman a Claude de asistente en colaborador informado al darle acceso a las mismas herramientas y datos que usas en tu trabajo diario',
      'Son atajos de teclado para ejecutar comandos rápidos en Claude',
      'Son plantillas predefinidas de prompts para casos de uso empresariales'
    ],
    correct: 1,
    feedback: 'Los connectors transforman a Claude de un asistente en un colaborador informado. En lugar de empezar cada conversación desde cero, Claude puede trabajar directamente con tu información real — los mismos datos y herramientas que tú usas cada día.'
  },
  {
    section: 'Connectors — Conexión con herramientas',
    sectionIdx: 1,
    text: '¿Qué protocolo estandarizado impulsa el funcionamiento de los connectors?',
    options: [
      'REST API con OAuth 2.0',
      'El Model Context Protocol (MCP)',
      'WebSocket Protocol (WSP)',
      'Claude Integration Standard (CIS)'
    ],
    correct: 1,
    feedback: 'El Model Context Protocol (MCP) es el estándar abierto que impulsa los connectors. El material lo describe como "USB-C para IA": un estándar universal que permite a Claude conectarse con muchas aplicaciones diferentes a través de una interfaz consistente.'
  },
  {
    section: 'Connectors — Conexión con herramientas',
    sectionIdx: 1,
    text: '¿Cuáles son los dos tipos de connectors que existen?',
    options: [
      'Connectors gratuitos y connectors premium de pago',
      'Web connectors (para servicios cloud) y desktop extensions (que corren localmente en tu computadora)',
      'Connectors de lectura y connectors de escritura',
      'Connectors oficiales de Anthropic y connectors de terceros'
    ],
    correct: 1,
    feedback: 'Existen dos tipos: los web connectors, que enlazan Claude con servicios cloud como Google Drive, Notion, Slack o Asana; y las desktop extensions, que corren localmente en tu computadora a través de la app de escritorio Claude Desktop, dando acceso a archivos locales y aplicaciones nativas.'
  },
  {
    section: 'Connectors — Conexión con herramientas',
    sectionIdx: 1,
    text: '¿Dónde está disponible el directorio oficial de connectors recomendados por Anthropic?',

  },
  {
    section: 'Connectors — Conexión con herramientas',
    sectionIdx: 1,
    text: '¿Qué organización del directorio tienen las dos pestañas disponibles en claude.ai/directory?',
    options: [
      'Gratuitos y de pago',
      'Web (servicios cloud) y Desktop extensions (herramientas locales)',
      'Productividad y Entretenimiento',
      'Oficiales y Comunitarios'
    ],
    correct: 1,
    feedback: 'El directorio se organiza en dos pestañas: "Web", que incluye servicios cloud como Gmail, Notion, Slack, Asana, Linear, Stripe y muchos más; y "Desktop extensions", que son herramientas locales que corren en tu computadora a través de la app Claude Desktop.'
  },
  {
    section: 'Connectors — Conexión con herramientas',
    sectionIdx: 1,
    text: '¿Cuál es el primer paso para configurar un web connector?',
    options: [
      'Descargar la app de escritorio Claude Desktop',
      'Encontrar el connector en claude.ai/directory o haciendo clic en + > Connectors en cualquier chat',
      'Pagar la suscripción Claude Team o Enterprise',
      'Instalar un plugin en el navegador'
    ],
    correct: 1,
    feedback: 'El primer paso es encontrar el connector navegando a claude.ai/directory o haciendo clic en el botón "+" en la parte inferior izquierda del chat y seleccionando Connectors. Luego haces clic en "Connect", te autentificas y otorgas los permisos necesarios.'
  },
  {
    section: 'Connectors — Conexión con herramientas',
    sectionIdx: 1,
    text: 'Después de hacer clic en "Connect" para un web connector, ¿qué ocurre a continuación?',
    options: [
      'Claude descarga automáticamente todos tus archivos al sistema',
      'Eres redirigido a la página de login del servicio para autenticarte con tus credenciales existentes',
      'Debes ingresar una API key manualmente en la configuración de Claude',
      'El connector se activa sin necesidad de ninguna autenticación adicional'
    ],
    correct: 1,
    feedback: 'Al hacer clic en "Connect", eres redirigido a la página de login del servicio. Inicias sesión con tus credenciales existentes (no creas credenciales nuevas), luego revisas y autorizas los permisos específicos que Claude está solicitando.'
  },
  {
    section: 'Connectors — Conexión con herramientas',
    sectionIdx: 1,
    text: '¿Qué requisito especial tienen las desktop extensions a diferencia de los web connectors?',
    options: [

    correct: 1,
    feedback: 'Las desktop extensions requieren la app de escritorio Claude Desktop, no la interfaz web. Estas extensiones permiten que Claude interactúe con aplicaciones locales, el sistema de archivos y funciones nativas de macOS o Windows.'
  },
  {
    section: 'Connectors — Conexión con herramientas',
    sectionIdx: 1,

// ==================== STATE ====================
var totalQ = questions.length;
var answered = new Array(totalQ).fill(false);
var correctArr = new Array(totalQ).fill(false);
var scoreCount = 0;

// section map
var sections = [];
questions.forEach(function(q, i) {
  var found = false;
  for (var s = 0; s < sections.length; s++) {
    if (sections[s].name === q.section) {
      sections[s].indices.push(i);
      found = true; break;
    }
  }
  if (!found) sections.push({ name: q.section, idx: q.sectionIdx, indices: [i] });
});

// ==================== RENDER ====================
function buildQuiz() {
  var container = document.getElementById('quizContainer');
  var html = '';
  var currentSection = null;

  questions.forEach(function(q, i) {
    if (q.section !== currentSection) {
      if (currentSection !== null) html += '<div class="quiz-divider"></div>';
      currentSection = q.section;
      var secData = sections.find(function(s) { return s.name === q.section; });
      html += '<div class="section-header">';
      html += '<div class="section-number">' + (secData ? secData.idx : '') + '</div>';
      html += '<div class="section-info"><h2>' + q.section + '</h2>';
      var cnt = sections.find(function(s) { return s.name === q.section; });
      html += '<p>' + (cnt ? cnt.indices.length : '') + ' preguntas</p></div>';
      html += '</div>';
    }

    var letters = ['A','B','C','D'];
    html += '<div class="question-card" id="card' + i + '">';
    html += '<div class="question-meta">';
    html += '<span class="question-num">Pregunta ' + (i + 1) + '</span>';
    html += '<div class="question-dot"></div>';
    html += '<span class="question-section-tag">' + q.section + '</span>';
    html += '</div>';
    html += '<div class="question-text">' + q.text + '</div>';
    html += '<div class="options-grid" id="opts' + i + '">';
    q.options.forEach(function(opt, j) {
      html += '<button class="option-btn" id="opt' + i + '_' + j + '" onclick="choose(' + i + ',' + j + ')">';
      html += '<div class="option-badge">' + letters[j] + '</div>';
      html += '<div class="option-text">' + opt + '</div>';
      html += '</button>';
    });
    html += '</div>';
    html += '<div class="feedback-box" id="fb' + i + '">';
    html += '<div class="feedback-label" id="fblabel' + i + '"></div>';
    html += '<div id="fbtext' + i + '"></div>';
    html += '</div>';
    html += '</div>';
  });

  container.innerHTML = html;
}

function choose(qIdx, optIdx) {
  if (answered[qIdx]) return;
  answered[qIdx] = true;

  var q = questions[qIdx];
  var isCorrect = (optIdx === q.correct);
  if (isCorrect) { correctArr[qIdx] = true; scoreCount++; }

  // style options
  for (var j = 0; j < q.options.length; j++) {
    var btn = document.getElementById('opt' + qIdx + '_' + j);
    btn.disabled = true;
    if (j === optIdx && isCorrect) btn.classList.add('correct');
    else if (j === optIdx && !isCorrect) btn.classList.add('wrong');
    else if (j === q.correct && !isCorrect) btn.classList.add('show-correct');
  }

  // card border
  var card = document.getElementById('card' + qIdx);
  card.classList.add(isCorrect ? 'answered-correct' : 'answered-wrong');

  // feedback
  var fb = document.getElementById('fb' + qIdx);
  var fblabel = document.getElementById('fblabel' + qIdx);
  var fbtext = document.getElementById('fbtext' + qIdx);
  fblabel.textContent = isCorrect ? '✓ Correcto' : '✗ Incorrecto';
  fbtext.textContent = q.feedback;
  fb.classList.add(isCorrect ? 'correct-fb' : 'wrong-fb');

  updateProgress();
}

function updateProgress() {
  var total = answered.filter(Boolean).length;
  var pct = Math.round((total / totalQ) * 100);
  document.getElementById('progressBar').style.width = pct + '%';
  document.getElementById('progressText').textContent = total + ' / ' + totalQ;
  document.getElementById('scoreDisplay').textContent = scoreCount + ' / ' + total;
  if (total > 0) document.getElementById('scoreDisplay').classList.add('active');

  document.getElementById('navAnswered').textContent = total;

  var nav = document.getElementById('stickyNav');
  if (total >= 3) nav.classList.add('visible');
  else nav.classList.remove('visible');
}

function showResults() {
  var panel = document.getElementById('resultsPanel');
  var pct = Math.round((scoreCount / totalQ) * 100);

  var icon = pct >= 80 ? '🎯' : pct >= 60 ? '📚' : '🔄';
  var title = pct >= 80 ? '¡Excelente trabajo!' : pct >= 60 ? '¡Buen progreso!' : 'Sigue practicando';
  var sub = 'Obtuviste ' + scoreCount + ' de ' + totalQ + ' preguntas correctas (' + pct + '%)';

  var breakdownHtml = '<div class="section-breakdown">';
  sections.forEach(function(sec) {
    var correct = sec.indices.filter(function(i) { return correctArr[i]; }).length;
    var total = sec.indices.length;
    var pctSec = total > 0 ? Math.round((correct / total) * 100) : 0;
    var barClass = pctSec >= 80 ? 'good' : pctSec >= 50 ? '' : 'bad';
    breakdownHtml += '<div class="breakdown-row">';
    breakdownHtml += '<div class="breakdown-label">' + sec.name + '</div>';
    breakdownHtml += '<div class="breakdown-stat">' + correct + '/' + total + '</div>';
    breakdownHtml += '<div class="breakdown-bar-wrap"><div class="breakdown-bar-fill ' + barClass + '" style="width:' + pctSec + '%"></div></div>';
    breakdownHtml += '</div>';
  });
  breakdownHtml += '</div>';

  panel.innerHTML = '<div class="results-icon">' + icon + '</div>' +
    '<div class="results-title">' + title + '</div>' +
    '<div class="results-score">' + pct + '%</div>' +
    '<div class="results-sub">' + sub + '</div>' +
    breakdownHtml +
    '<button class="retry-btn" onclick="retryQuiz()">Reintentar quiz</button>';

  panel.classList.add('visible');
  panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
  document.getElementById('stickyNav').classList.remove('visible');
}

function retryQuiz() {
  answered = new Array(totalQ).fill(false);
  correctArr = new Array(totalQ).fill(false);
  scoreCount = 0;
  document.getElementById('resultsPanel').classList.remove('visible');
  document.getElementById('scoreDisplay').textContent = '0 / 0';
  document.getElementById('scoreDisplay').classList.remove('active');
  buildQuiz();
  updateProgress();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// init
buildQuiz();
updateProgress();
</script>
