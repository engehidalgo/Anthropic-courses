<!DOCTYPE html>
<html lang='es'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1.0'>
<title>Claude 101 — Capítulo 2: Organizando tu trabajo y conocimiento</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --black: #0a0a0a;
    --near-black: #111111;
    --dark: #1a1a1a;
    --mid: #2a2a2a;
    --border: #333;
    --text: #e8e6e1;
    --muted: #888;
    --orange: #d4783a;
    --orange-light: #e8934f;
    --orange-glow: rgba(212,120,58,0.15);
    --blue: #3a7bd4;
    --blue-light: #5a9be8;
    --green: #2d7a4f;
    --green-light: #3da066;
    --green-bg: rgba(45,122,79,0.12);
    --red: #8b2424;
    --red-light: #c43030;
    --red-bg: rgba(139,36,36,0.12);
    --radius: 12px;
    --radius-sm: 8px;
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--black);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.6;
  }

  .header {
    background: linear-gradient(135deg, #0a0a0a 0%, #081018 40%, #0f0f0f 70%, #0a0a0a 100%);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(12px);
  }

  .header-inner {
    max-width: 860px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 18px 0 14px;
    flex-wrap: wrap;
  }

  .logo { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }

  .asterisk { width: 32px; height: 32px; color: var(--orange); flex-shrink: 0; }

  .logo-text {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 1.1rem;
    color: var(--text);
    letter-spacing: -0.02em;
  }

  .logo-text span { color: var(--orange); }

  .header-meta { margin-left: auto; display: flex; align-items: center; gap: 12px; flex-shrink: 0; }

  .chapter-badge {
    font-family: 'Syne', sans-serif;
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--orange);
    background: var(--orange-glow);
    border: 1px solid rgba(212,120,58,0.3);
    padding: 4px 10px;
    border-radius: 20px;
  }

  .score-pill {
    font-family: 'Syne', sans-serif;
    font-size: 0.8rem;
    font-weight: 700;
    color: var(--muted);
    background: var(--mid);
    border: 1px solid var(--border);
    padding: 4px 12px;
    border-radius: 20px;
    transition: all 0.3s;
  }

  .score-pill.active {
    color: var(--blue-light);
    border-color: rgba(58,123,212,0.4);
    background: rgba(58,123,212,0.1);
  }

  .progress-container {
    background: var(--near-black);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    position: sticky;
    top: 71px;
    z-index: 99;
  }

  .progress-inner {
    max-width: 860px;
    margin: 0 auto;
    padding: 10px 0;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .progress-bar-wrap { flex: 1; height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }

  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--blue), var(--blue-light));
    border-radius: 2px;
    transition: width 0.5s cubic-bezier(0.4,0,0.2,1);
    width: 0%;
    box-shadow: 0 0 8px rgba(90,155,232,0.5);
  }

  .progress-text {
    font-size: 0.72rem;
    color: var(--muted);
    white-space: nowrap;
    font-family: 'Syne', sans-serif;
    font-weight: 600;
    letter-spacing: 0.05em;
  }

  .main { max-width: 860px; margin: 0 auto; padding: 40px 24px 80px; }

  .hero {
    text-align: center;
    padding: 48px 0 56px;
    position: relative;
  }

  .hero::before {
    content: '';
    position: absolute;
    top: 0; left: 50%; transform: translateX(-50%);
    width: 300px; height: 300px;
    background: radial-gradient(ellipse, rgba(58,123,212,0.07) 0%, transparent 70%);
    pointer-events: none;
  }

  .hero-eyebrow {
    font-family: 'Syne', sans-serif;
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--orange);
    margin-bottom: 16px;
  }

  .hero-title {
    font-family: 'Syne', sans-serif;
    font-size: clamp(1.8rem, 5vw, 2.8rem);
    font-weight: 800;
    line-height: 1.05;
    letter-spacing: -0.04em;
    color: var(--text);
    margin-bottom: 16px;
  }

  .hero-subtitle {
    font-size: 1rem;
    color: var(--muted);
    max-width: 520px;
    margin: 0 auto 32px;
    font-weight: 300;
  }

  .hero-stats { display: flex; justify-content: center; gap: 32px; flex-wrap: wrap; }

  .hero-stat { text-align: center; }

  .hero-stat-num {
    font-family: 'Syne', sans-serif;
    font-size: 1.5rem;
    font-weight: 800;
    color: var(--orange);
  }

  .hero-stat-label { font-size: 0.72rem; color: var(--muted); letter-spacing: 0.05em; text-transform: uppercase; }

  .section-header {
    display: flex;
    align-items: center;
    gap: 14px;
    margin: 48px 0 24px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }

  .section-number {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: var(--orange-glow);
    border: 1px solid rgba(212,120,58,0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Syne', sans-serif;
    font-size: 0.8rem;
    font-weight: 800;
    color: var(--orange);
    flex-shrink: 0;
  }

  .section-info h2 {
    font-family: 'Syne', sans-serif;
    font-size: 1.05rem;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -0.02em;
  }

  .section-info p { font-size: 0.78rem; color: var(--muted); margin-top: 2px; }

  .question-card {
    background: var(--near-black);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px;
    margin-bottom: 16px;
    transition: border-color 0.2s;
  }

  .question-card.answered-correct {
    border-color: var(--green);
    background: linear-gradient(135deg, var(--near-black), rgba(45,122,79,0.05));
  }

  .question-card.answered-wrong {
    border-color: var(--red);
    background: linear-gradient(135deg, var(--near-black), rgba(139,36,36,0.05));
  }

  .question-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }

  .question-num {
    font-family: 'Syne', sans-serif;
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .question-dot { width: 3px; height: 3px; border-radius: 50%; background: var(--border); }

  .question-section-tag {
    font-size: 0.65rem;
    color: var(--orange);
    background: var(--orange-glow);
    border: 1px solid rgba(212,120,58,0.2);
    padding: 2px 7px;
    border-radius: 10px;
    font-weight: 500;
  }

  .question-text { font-size: 0.97rem; color: var(--text); margin-bottom: 20px; line-height: 1.55; font-weight: 400; }

  .options-grid { display: grid; gap: 8px; }

  .option-btn {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 14px 16px;
    background: var(--dark);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    cursor: pointer;
    text-align: left;
    transition: all 0.15s;
    font-family: 'DM Sans', sans-serif;
    width: 100%;
  }

  .option-btn:hover:not(:disabled) {
    border-color: rgba(212,120,58,0.4);
    background: rgba(212,120,58,0.05);
  }

  .option-btn:disabled { cursor: default; }

  .option-badge {
    width: 26px;
    height: 26px;
    border-radius: 6px;
    background: var(--mid);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Syne', sans-serif;
    font-size: 0.72rem;
    font-weight: 800;
    color: var(--muted);
    flex-shrink: 0;
    transition: all 0.15s;
  }

  .option-text { font-size: 0.9rem; color: var(--text); line-height: 1.45; padding-top: 2px; font-weight: 300; }

  .option-btn.correct { border-color: var(--green-light); background: var(--green-bg); }
  .option-btn.correct .option-badge { background: var(--green); border-color: var(--green-light); color: #fff; }

  .option-btn.wrong { border-color: var(--red-light); background: var(--red-bg); }
  .option-btn.wrong .option-badge { background: var(--red); border-color: var(--red-light); color: #fff; }

  .option-btn.show-correct { border-color: var(--green); background: rgba(45,122,79,0.06); opacity: 0.7; }
  .option-btn.show-correct .option-badge { background: var(--green); border-color: var(--green-light); color: #fff; }

  .feedback-box {
    margin-top: 14px;
    padding: 14px 16px;
    border-radius: var(--radius-sm);
    font-size: 0.85rem;
    line-height: 1.5;
    font-weight: 300;
    display: none;
    animation: fadeSlide 0.25s ease;
  }

  @keyframes fadeSlide {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .feedback-box.correct-fb { display: block; background: var(--green-bg); border: 1px solid var(--green); color: #7dd4a0; }
  .feedback-box.wrong-fb { display: block; background: var(--red-bg); border: 1px solid var(--red-light); color: #e08080; }

  .feedback-label {
    font-family: 'Syne', sans-serif;
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 4px;
  }

  .feedback-box.correct-fb .feedback-label { color: var(--green-light); }
  .feedback-box.wrong-fb .feedback-label { color: var(--red-light); }

  .results-panel {
    display: none;
    background: var(--near-black);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 40px;
    margin-top: 48px;
    text-align: center;
    animation: fadeSlide 0.4s ease;
  }

  .results-panel.visible { display: block; }

  .results-icon { font-size: 3rem; margin-bottom: 16px; }

  .results-title {
    font-family: 'Syne', sans-serif;
    font-size: 1.8rem;
    font-weight: 800;
    letter-spacing: -0.03em;
    margin-bottom: 8px;
  }

  .results-score {
    font-family: 'Syne', sans-serif;
    font-size: 4rem;
    font-weight: 800;
    line-height: 1;
    margin: 16px 0;
    color: var(--orange);
  }

  .results-sub { font-size: 0.9rem; color: var(--muted); margin-bottom: 32px; }

  .section-breakdown { display: grid; gap: 12px; margin: 24px 0; text-align: left; }

  .breakdown-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    background: var(--dark);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
  }

  .breakdown-label { flex: 1; font-size: 0.85rem; color: var(--text); font-weight: 400; }

  .breakdown-stat { font-family: 'Syne', sans-serif; font-size: 0.85rem; font-weight: 700; color: var(--muted); }

  .breakdown-bar-wrap { width: 80px; height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }

  .breakdown-bar-fill { height: 100%; border-radius: 2px; background: linear-gradient(90deg, var(--blue), var(--blue-light)); }
  .breakdown-bar-fill.good { background: linear-gradient(90deg, var(--green), var(--green-light)); }
  .breakdown-bar-fill.bad { background: linear-gradient(90deg, var(--red), var(--red-light)); }

  .retry-btn {
    margin-top: 24px;
    padding: 14px 32px;
    background: var(--orange);
    color: var(--black);
    border: none;
    border-radius: var(--radius-sm);
    font-family: 'Syne', sans-serif;
    font-size: 0.9rem;
    font-weight: 800;
    letter-spacing: 0.05em;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
  }

  .retry-btn:hover { background: var(--orange-light); transform: translateY(-1px); }
  .retry-btn:active { transform: translateY(0); }

  .quiz-divider {
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--border), transparent);
    margin: 48px 0;
  }

  .sticky-nav {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--dark);
    border: 1px solid var(--border);
    border-radius: 100px;
    padding: 8px 8px 8px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    backdrop-filter: blur(12px);
    z-index: 200;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s, transform 0.3s;
  }

  .sticky-nav.visible { opacity: 1; pointer-events: all; }

  .sticky-nav-text { font-size: 0.82rem; color: var(--muted); white-space: nowrap; }

  .sticky-nav-text strong { color: var(--text); font-family: 'Syne', sans-serif; font-weight: 700; }

  .see-results-btn {
    padding: 10px 20px;
    background: var(--orange);
    color: var(--black);
    border: none;
    border-radius: 100px;
    font-family: 'Syne', sans-serif;
    font-size: 0.8rem;
    font-weight: 800;
    cursor: pointer;
    transition: background 0.2s;
    letter-spacing: 0.03em;
  }

  .see-results-btn:hover { background: var(--orange-light); }

  @media (max-width: 600px) {
    .main { padding: 24px 16px 100px; }
    .question-card { padding: 20px; }
    .header-inner { gap: 8px; }
    .hero-stats { gap: 20px; }
  }
</style>
</head>
<body>

<header class='header'>
  <div class='header-inner'>
    <div class='logo'>
      <svg class='asterisk' viewBox='0 0 100 100' fill='none' xmlns='http://www.w3.org/2000/svg'>
        <line x1='50' y1='5' x2='50' y2='95' stroke='currentColor' stroke-width='10' stroke-linecap='round'/>
        <line x1='5' y1='27.5' x2='95' y2='72.5' stroke='currentColor' stroke-width='10' stroke-linecap='round'/>
        <line x1='5' y1='72.5' x2='95' y2='27.5' stroke='currentColor' stroke-width='10' stroke-linecap='round'/>
      </svg>
      <span class='logo-text'>Claude <span>101</span></span>
    </div>
    <div class='header-meta'>
      <span class='chapter-badge'>Cap. 2</span>
      <span class='score-pill' id='scoreDisplay'>0 / 0</span>
    </div>
  </div>
</header>

<div class='progress-container'>
  <div class='progress-inner'>
    <div class='progress-bar-wrap'>
      <div class='progress-bar-fill' id='progressBar'></div>
    </div>
    <span class='progress-text' id='progressText'>0 / 50</span>
  </div>
</div>

<main class='main'>
  <div class='hero'>
    <div class='hero-eyebrow'>Anthropic Academy · Claude 101</div>
    <h1 class='hero-title'>Organizando tu trabajo y conocimiento</h1>
    <p class='hero-subtitle'>Pon a prueba lo que aprendiste sobre Projects, Skills y Artifacts — y cómo integrarlos en tu flujo de trabajo.</p>
    <div class='hero-stats'>
      <div class='hero-stat'><div class='hero-stat-num'>50</div><div class='hero-stat-label'>Preguntas</div></div>
      <div class='hero-stat'><div class='hero-stat-num'>4</div><div class='hero-stat-label'>Secciones</div></div>
      <div class='hero-stat'><div class='hero-stat-num'>~20</div><div class='hero-stat-label'>Minutos</div></div>
    </div>
  </div>

  <div id='quizContainer'></div>
  <div class='results-panel' id='resultsPanel'></div>
</main>

<div class='sticky-nav' id='stickyNav'>
  <span class='sticky-nav-text'>Respondidas: <strong id='navAnswered'>0</strong> de <strong>50</strong></span>
  <button class='see-results-btn' onclick='showResults()'>Ver resultados →</button>
</div>

<script>
'use strict';

var questions = [

  // ==================== SECCIÓN 1: Projects — Conceptos Fundamentales ====================
  {
    section: 'Projects — Conceptos Fundamentales',
    sectionIdx: 1,
    text: '¿Cuál es la definición más precisa de un Project en Claude?',
    options: [
      'Una carpeta para guardar archivos de texto en la nube',
      'Un entorno autocontenido con su propio historial de chats, base de conocimiento y configuraciones personalizadas',
      'Un tipo de conversación más larga que las normales',
      'Un plan de suscripción especial con más funciones'
    ],
    correct: 1,
    feedback: 'Los Projects son entornos autocontenidos (self-contained environments) con su propio historial de chats, bases de conocimiento específicas y configuraciones personalizadas. Son espacios de trabajo dedicados para flujos de trabajo específicos.'
  },
  {
    section: 'Projects — Conceptos Fundamentales',
    sectionIdx: 1,
    text: '¿Para qué tipos de trabajo son más valiosos los Projects?',
    options: [
      'Preguntas únicas y rápidas que no requieren seguimiento',
      'Trabajo en curso con materiales de referencia repetidos, requisitos consistentes de respuesta o necesidades de colaboración en equipo',
      'Tareas de codificación que requieren acceso al sistema de archivos local',
      'Conversaciones de aprendizaje con extended thinking'
    ],
    correct: 1,
    feedback: 'Los Projects son especialmente valiosos para trabajo en curso (ongoing), no para preguntas puntuales. Son ideales cuando tienes materiales de referencia que usarás repetidamente, requisitos consistentes de respuesta, o necesidades de colaboración en equipo.'
  },
  {
    section: 'Projects — Conceptos Fundamentales',
    sectionIdx: 1,
    text: '¿Qué es el "Project knowledge" (conocimiento del proyecto)?',
    options: [
      'Un resumen automático que Claude genera sobre el proyecto',
      'Los documentos relevantes cargados al proyecto que Claude referencia automáticamente en todos los chats',
      'Las instrucciones de proyecto que guían el comportamiento de Claude',
      'El historial completo de todas las conversaciones del proyecto'
    ],
    correct: 1,
    feedback: 'El Project knowledge son los documentos que subes al proyecto. Cada vez que chateas con Claude dentro del proyecto, ese conocimiento es considerado automáticamente junto con tu prompt, sin necesidad de volver a cargar los archivos.'
  },
  {
    section: 'Projects — Conceptos Fundamentales',
    sectionIdx: 1,
    text: '¿Cuántos pasos describe el material para crear tu primer proyecto?',
    options: ['2 pasos', '3 pasos', '4 pasos', '5 pasos'],
    correct: 1,
    feedback: 'El material describe exactamente 3 pasos: Paso 1 — configurar el proyecto (nombre, descripción, visibilidad). Paso 2 — añadir instrucciones de proyecto. Paso 3 — construir la base de conocimiento cargando archivos.'
  },
  {
    section: 'Projects — Conceptos Fundamentales',
    sectionIdx: 1,
    text: '¿Dónde se crea un nuevo proyecto en Claude.ai?',
    options: [
      'En Settings > Projects > New Project',
      'Navegando a claude.ai/projects y haciendo clic en "+ New Project" en la esquina superior derecha',
      'Desde el menú de herramientas en una conversación existente',
      'Solo desde la app de escritorio, no desde la web'
    ],
    correct: 1,
    feedback: 'Para crear un nuevo proyecto: pasa el cursor sobre la barra lateral izquierda y haz clic en "Projects", o navega directamente a claude.ai/projects, luego haz clic en "+ New Project" en la esquina superior derecha.'
  },
  {
    section: 'Projects — Conceptos Fundamentales',
    sectionIdx: 1,
    text: '¿Qué ocurre con el contexto entre chats separados dentro de un mismo proyecto?',
    options: [
      'El contexto se comparte automáticamente entre todos los chats del proyecto',
      'El contexto no se comparte entre chats distintos a menos que la información esté en la base de conocimiento del proyecto',
      'Cada chat tiene acceso al historial completo de todos los otros chats del proyecto',
      'El contexto se comparte solo si el usuario lo activa manualmente desde la configuración'
    ],
    correct: 1,
    feedback: 'Importante: el contexto NO se comparte entre chats separados dentro de un proyecto, a menos que esa información esté añadida a la base de conocimiento del proyecto. La base de conocimiento es el puente entre conversaciones distintas.'
  },
  {
    section: 'Projects — Conceptos Fundamentales',
    sectionIdx: 1,
    text: '¿Para qué sirve el campo "descripción" al crear un proyecto?',
    options: [
      'Claude usa la descripción directamente como contexto en todas sus respuestas dentro del proyecto',
      'Ayuda al usuario y a sus compañeros a entender el propósito del proyecto, aunque Claude no la ve directamente',
      'La descripción reemplaza a las instrucciones de proyecto',
      'Es un prompt inicial que Claude usa solo en el primer chat del proyecto'
    ],
    correct: 1,
    feedback: 'Según el material, Claude no ve directamente la descripción del proyecto. Su propósito es ayudarte a ti y a tus compañeros de equipo a entender para qué sirve el proyecto. Las instrucciones son lo que Claude sí lee y aplica.'
  },
  {
    section: 'Projects — Conceptos Fundamentales',
    sectionIdx: 1,
    text: '¿Qué tipos de visibilidad se pueden configurar para un proyecto?',
    options: [
      'Solo privado o solo público en internet',
      'Privado (uso personal) o compartido con la organización (para usuarios Claude for Work)',
      'Privado, compartido con el equipo, y público en internet para todos',
      'La visibilidad no se puede configurar una vez creado el proyecto'
    ],
    correct: 1,
    feedback: 'Al configurar un proyecto puedes elegir mantenerlo privado (solo tú) o compartirlo con tu organización. La opción de compartir con la organización es exclusiva para usuarios de Claude for Work (Team y Enterprise).'
  },
  {

// ==================== STATE ====================
var state = {
  answers: {},
  totalQuestions: questions.length
};

var sections = {};
questions.forEach(function(q, i) {
  if (!sections[q.section]) sections[q.section] = [];
  sections[q.section].push(i);
});

function updateProgress() {
  var answered = Object.keys(state.answers).length;
  var pct = (answered / state.totalQuestions) * 100;
  document.getElementById('progressBar').style.width = pct + '%';
  document.getElementById('progressText').textContent = answered + ' / ' + state.totalQuestions;

  var correct = 0;
  Object.keys(state.answers).forEach(function(k) {
    if (state.answers[k].correct) correct++;
  });
  var scoreEl = document.getElementById('scoreDisplay');
  scoreEl.textContent = correct + ' / ' + answered;
  if (answered > 0) scoreEl.classList.add('active');

  var navEl = document.getElementById('stickyNav');
  document.getElementById('navAnswered').textContent = answered;
  navEl.classList.toggle('visible', answered >= 5);
}

function answerQuestion(qIdx, optIdx) {
  if (state.answers[qIdx]) return;
  var q = questions[qIdx];
  var isCorrect = optIdx === q.correct;
  state.answers[qIdx] = { chosen: optIdx, correct: isCorrect };

  var card = document.getElementById('qcard-' + qIdx);
  card.classList.add(isCorrect ? 'answered-correct' : 'answered-wrong');

  var opts = card.querySelectorAll('.option-btn');
  opts.forEach(function(btn, i) {
    btn.disabled = true;
    if (i === q.correct) {
      btn.classList.add(isCorrect ? 'correct' : 'show-correct');
    }
    if (i === optIdx && !isCorrect) {
      btn.classList.add('wrong');
    }
  });

  var fb = card.querySelector('.feedback-box');
  fb.classList.add(isCorrect ? 'correct-fb' : 'wrong-fb');
  fb.querySelector('.feedback-text').textContent = q.feedback;

  updateProgress();
}

function renderQuiz() {
  var container = document.getElementById('quizContainer');
  var html = '';
  var sectionNames = Object.keys(sections);
  var letters = ['A','B','C','D'];

  sectionNames.forEach(function(sName, sI) {
    html += '<div class="section-header">';
    html += '<div class="section-number">' + (sI+1) + '</div>';
    html += '<div class="section-info"><h2>' + sName + '</h2>';
    html += '<p>' + sections[sName].length + ' preguntas</p></div></div>';

    sections[sName].forEach(function(qIdx) {
      var q = questions[qIdx];
      var localNum = sections[sName].indexOf(qIdx) + 1;
      html += '<div class="question-card" id="qcard-' + qIdx + '">';
      html += '<div class="question-meta">';
      html += '<span class="question-num">Pregunta ' + localNum + '</span>';
      html += '<span class="question-dot"></span>';
      html += '<span class="question-section-tag">' + sName + '</span>';
      html += '</div>';
      html += '<div class="question-text">' + q.text + '</div>';
      html += '<div class="options-grid">';
      q.options.forEach(function(opt, oI) {
        html += '<button class="option-btn" onclick="answerQuestion(' + qIdx + ',' + oI + ')">';
        html += '<span class="option-badge">' + letters[oI] + '</span>';
        html += '<span class="option-text">' + opt + '</span>';
        html += '</button>';
      });
      html += '</div>';
      html += '<div class="feedback-box"><div class="feedback-label">Explicación</div><div class="feedback-text"></div></div>';
      html += '</div>';
    });

    if (sI < sectionNames.length - 1) {
      html += '<div class="quiz-divider"></div>';
    }
  });

  container.innerHTML = html;
}

function showResults() {
  var panel = document.getElementById('resultsPanel');
  var answered = Object.keys(state.answers).length;
  var correct = 0;
  Object.keys(state.answers).forEach(function(k) {
    if (state.answers[k].correct) correct++;
  });
  var pct = answered > 0 ? Math.round((correct / state.totalQuestions) * 100) : 0;

  var emoji = pct >= 80 ? '🎉' : pct >= 60 ? '👍' : '📚';
  var msg = pct >= 80 ? '¡Excelente dominio del capítulo!' : pct >= 60 ? 'Buen trabajo, sigue practicando.' : 'Repasa el material y vuelve a intentarlo.';

  var breakdownHtml = '';
  var sectionNames = Object.keys(sections);
  sectionNames.forEach(function(sName) {
    var total = sections[sName].length;
    var sc = 0;
    sections[sName].forEach(function(qIdx) {
      if (state.answers[qIdx] && state.answers[qIdx].correct) sc++;
    });
    var pctSec = total > 0 ? Math.round((sc / total) * 100) : 0;
    var barClass = pctSec >= 75 ? 'good' : pctSec >= 50 ? '' : 'bad';
    breakdownHtml += '<div class="breakdown-row">';
    breakdownHtml += '<span class="breakdown-label">' + sName + '</span>';
    breakdownHtml += '<div class="breakdown-bar-wrap"><div class="breakdown-bar-fill ' + barClass + '" style="width:' + pctSec + '%"></div></div>';
    breakdownHtml += '<span class="breakdown-stat">' + sc + '/' + total + '</span>';
    breakdownHtml += '</div>';
  });

  panel.innerHTML = '<div class="results-icon">' + emoji + '</div>' +
    '<div class="results-title">' + msg + '</div>' +
    '<div class="results-score">' + pct + '%</div>' +
    '<div class="results-sub">' + correct + ' correctas de ' + state.totalQuestions + ' preguntas</div>' +
    '<div class="section-breakdown">' + breakdownHtml + '</div>' +
    '<button class="retry-btn" onclick="retryQuiz()">Reintentar quiz →</button>';

  panel.classList.add('visible');
  panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
  document.getElementById('stickyNav').classList.remove('visible');
}

function retryQuiz() {
  state.answers = {};
  document.getElementById('resultsPanel').classList.remove('visible');
  renderQuiz();
  updateProgress();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

renderQuiz();
updateProgress();
</script>
